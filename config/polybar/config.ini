# ==========================================
# Nord Palette Colors
# ==========================================
[colors]
nord0  = #2e3440
nord1  = #3b4252
nord2  = #434c5e
nord3  = #4c566a
nord4  = #d8dee9
nord5  = #e5e9f0
nord6  = #eceff4
nord7  = #8fbcbb
nord8  = #88c0d0
nord9  = #81a1c1
nord10 = #5e81ac
nord11 = #bf616a
nord12 = #d08770
nord13 = #ebcb8b
nord14 = #a3be8c
nord15 = #b48ead

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

; Solid bar background spanning completely from left to right
background = ${colors.nord0}
foreground = ${colors.nord4}
line-size = 0

override-redirect = false
wm-restack = bspwm

padding-left = 1
padding-right = 1
module-margin = 0

# ==========================================
# Font Declarations & Index Routing
# ==========================================

# Fonts
font-0 = "JetBrains Mono:style=Bold:size=14;3"
font-1 = "Font Awesome 6 Free Solid:size=16;3"      
font-2 = "JetBrainsMono Nerd Font Mono:size=17;3"  
font-3 = "FiraCode Nerd Font Mono:size=17;3"       
font-4 = "JetBrainsMono Nerd Font:size=18;4" 

# Layout updated: Bluetooth is isolated into its own capsule with dedicated round caps.
# Right side layout fixed by replacing the duplicate 'utils-left' with 'audio-left'.
modules-left = ws-left xworkspaces ws-right gap-wifi bt-left bluetooth bt-right gap-wifi powermenu
modules-center = xwindow
modules-right = notification-bell utils-left rofi-wifi wifi-right gap-wifi audio-left pulseaudio battery date utils-right

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

;; ==========================================
;; Helper Rounding Modules (Pill Caps)
;; ==========================================
; Workspaces Capsule
[module/ws-left]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}

[module/ws-right]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}
format-margin-right = 2

; Dedicated Bluetooth Capsule Caps
[module/bt-left]
type = custom/text
format = <label>
label = "%{T5}%{T-}"
label-background = ${colors.nord0}
label-foreground = #1e1e2e

[module/bt-right]
type = custom/text
format = <label>
label = "%{T5}%{T-}"
label-background = ${colors.nord0}
label-foreground = #1e1e2e
format-margin-right = 2

; Right Side Utilities Capsule (First Pill - WiFi)
[module/utils-left]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}

; Right Side Utilities Capsule (Second Pill - Audio/Specs)
[module/audio-left]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}

[module/utils-right]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}

;-------------------------- wifi -------------------------------
; Dedicated caps to close the Wi-Fi pill
[module/wifi-right]
type = custom/text
format = <label>
label = %{T5}%{T-}
label-background = ${colors.nord0}
label-foreground = ${colors.nord1}

; FORCED GAP MODULE: Generates a reliable space matching the bar background color
[module/gap-wifi]
type = custom/text
format = <label>
label = "  "
label-background = ${colors.nord0}

;-------------------------- wifi -------------------------------

;; ==========================================
;; Left Side Modules
;; ==========================================
[module/xworkspaces]
type = internal/xworkspaces

icon-0 = I;1
icon-1 = II;2
icon-2 = III;3
icon-3 = IV;4
icon-4 = V;5
icon-5 = VI;6
icon-6 = VII;7
icon-7 = VIII;8
icon-8 = IX;9
icon-9 = X;10

label-active = %icon%
label-active-foreground = ${colors.nord8}
label-active-background = ${colors.nord1}
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.nord5}
label-occupied-background = ${colors.nord1}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-foreground = ${colors.nord11}
label-urgent-background = ${colors.nord1}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.nord3}
label-empty-background = ${colors.nord1}
label-empty-padding = 1

[module/powermenu]
type = custom/text
format = <label>
label = "%{T3}%{T-}" 
label-foreground = #e70b0b
format-padding = 1
format-margin-right = 5
click-left = ~/.config/polybar/scripts/powermenu.sh

;; ==========================================
;; Center Modules
;; ==========================================
[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = #81A1C1
label-empty = Desktop
label-empty-foreground = #81A1C1

;; ==========================================
;; Right Side Modules
;; ==========================================
[module/notification-bell]
type = custom/text
format = <label>
label = " "
label-foreground = ${colors.nord15}
label-background = ${colors.nord0}
format-padding = 1
format-margin-right = 2

click-left = dunstctl history-pop
click-right = dunstctl close-all
click-middle = dunstctl set-paused toggle

[module/rofi-wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 5
click-left = ~/.config/polybar/scripts/wifi.sh --menu >/dev/null 2>&1 &

label = "%output:0:10:...% "
format-foreground = #FFFFFF
format-background = ${colors.nord1}
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.nord13}
format-volume-background = ${colors.nord1}
format-volume-padding = 1
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-foreground = ${colors.nord3}
format-muted-background = ${colors.nord1}
format-muted-padding = 1
format-muted-prefix = "   "
format-muted-prefix-foreground = ${colors.nord3}
label-muted = muted

ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "
ramp-volume-foreground = ${colors.nord13}

[module/battery]
type = custom/script
exec = $HOME/.config/polybar/scripts/battery.sh
interval = 1
format-foreground = ${colors.nord8}
format-background = ${colors.nord1}
format-padding = 1

[module/date]
type = internal/date
interval = 1

date = %I:%M %p
date-alt = %I:%M %p

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.nord7}
format-prefix-background = ${colors.nord1}
format-background = ${colors.nord1}
format-padding = 1

label = %date%
label-foreground = ${colors.nord4}

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && (bluetoothctl devices Connected | grep -q "Device" && echo " Connected" || echo " On") || echo " Off"
interval = 5
click-left = ~/.config/polybar/scripts/bluetooth.sh

format-foreground = #7aa2f7
format-background = #1e1e2e
format-padding = 1
