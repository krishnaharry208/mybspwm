;==========================================================
;
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

[colors]
background = ${xrdb:background}
foreground = ${xrdb:foreground}
primary = ${xrdb:color6}
secondary = ${xrdb:color5}
alert = ${xrdb:color8}

; Active Shade 
shade0 = ${xrdb:color0}
shade1 = ${xrdb:color1}
shade2 = ${xrdb:color2}
shade3 = ${xrdb:color3}
shade4 = ${xrdb:color4}
shade5 = ${xrdb:color5}
shade6 = ${xrdb:color6}
shade7 = ${xrdb:color7}
shade8 = ${xrdb:color8}
shade9 = ${xrdb:color9}
shade10 = ${xrdb:color10}
shade11 = ${xrdb:color11}
shade12 = ${xrdb:color12}
shade13 = ${xrdb:color13}
shade14 = ${xrdb:color14}
shade15 = ${xrdb:color15}
shade16 = ${xrdb:color0}
shade17 = ${xrdb:color0}
shade18 = ${xrdb:color0}

[bar/main]
width = 100%
height = 38
offset-x = 0
offset-y = 0
;radius = 18.0
fixed-center = true
bottom = false
#monitor = ${env:MONITOR:eDP-1}
monitor = ${env:MONITOR:eDP}
background = ${colors.background}
foreground = ${colors.foreground}

overline-size = 8
underline-size = 5
line-color = ${colors.background}

border-bottom-size = 1
border-color = ${colors.shade0}

;padding-left = 1
;padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = FiraCode Nerd Font:style=Regular:size=14;4
font-1 = Font Awesome 5 Brands:size=17;4
font-2 = Font Awesome 5 Free Solid:size=17;4
font-3 = FiraCode Nerd Font Mono:style=Regular:size=20;4
font-4 = Font Awesome 5 Free Solid:size=20;4
font-5 = Noto Color Emoji:scale=20;4
font-6 = Material Design Icons:scale=20;4


modules-left = launcher sep left bspwm right sep left pulseaudio right sep bluetooth sep powermenu 
modules-center = xwindow
modules-right = dunst sep left wlan right sep left battery backlight right sep left time right sep 

override-redirect = false
wm-restack = bspwm

scroll-up = #bspwm.prev
scroll-down = #bspwm.next

cursor-click = pointer

enable-ipc = true
pseudo-transparency = false

;==========================================================
; MODULES
;==========================================================


;----------------------------------------------------------
; Separator
;----------------------------------------------------------

[module/sep]

type = custom/text

format-foreground = ${colors.background}
format-background = ${colors.background}
format = " "


;----------------------------------------------------------
; Void
;----------------------------------------------------------

[module/void]

type = custom/text

format-foreground = ${colors.shade16}
format-background = ${colors.shade16}
format = " "


;----------------------------------------------------------
; Left Rounded Edge
;----------------------------------------------------------

[module/left]

type = custom/text

format-foreground = ${colors.shade16}
format-background = ${colors.background}

format-overline = ${colors.background}
format-underline = ${colors.background}

format = ""


;----------------------------------------------------------
; Right Rounded Edge
;----------------------------------------------------------

[module/right]

type = custom/text

format-foreground = ${colors.shade16}
format-background = ${colors.background}

format-overline = ${colors.background}
format-underline = ${colors.background}

format = ""


;==========================================================
; BSPWM
;==========================================================

[module/bspwm]

type = internal/bspwm

format = <label-state>

pin-workspaces = false
enable-scroll = true

;label-separator = ""
;label-separator-background = ${colors.shade16}


; Workspace Borders
label-focused-overline = ${colors.background}
label-occupied-overline = ${colors.background}
label-urgent-overline = ${colors.background}
label-empty-overline = ${colors.background}
label-separator-overline = ${colors.background}
label-separator-underline = ${colors.background}

label-focused-underline = ${colors.background}
label-occupied-underline = ${colors.background}
label-urgent-underline = ${colors.background}
label-empty-underline = ${colors.background}


; Workspace Icons
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;


; Focused
label-focused = %icon%
label-focused-padding = 1
label-focused-foreground = ${colors.shade3}
label-focused-background = ${colors.shade16}


; Occupied
label-occupied = %icon%
label-occupied-padding = 1
label-occupied-background = ${colors.shade16}
label-occupied-foreground = ${colors.shade7}


; Urgent
label-urgent = %icon%
label-urgent-padding = 1
label-urgent-background = ${colors.shade16}
label-urgent-foreground = ${colors.shade1}


; Empty
label-empty = %icon%
label-empty-padding = 1
label-empty-background = ${colors.shade16}
label-empty-foreground = ${colors.shade4}


;==========================================================
; BSPWM LAYOUT
;==========================================================

[module/bsplayout]

type = internal/bspwm

format = <label-mode>

pin-workspace = false
enable-scroll = false
inline-mode = false


; Layout Colors
format-background = ${colors.shade16}
format-foreground = ${colors.shade1}

;format-suffix = %{Fcolors.shade7}|%{F-}
;format-padding = 1


; Borders
label-monocle-overline = ${colors.background}
label-tiled-overline = ${colors.background}

label-monocle-underline = ${colors.background}
label-tiled-underline = ${colors.background}


; Layout Icons
label-monocle = 
label-tiled = 

;label-monocle-padding = 1
;label-tiled-padding = 1


;==========================================================
; BSPWM MODE
;==========================================================

[module/bspmode]

type = internal/bspwm

format = <label-mode>

pin-workspace = false
enable-scroll = false
inline-mode = false


format-background = ${colors.shade16}
format-foreground = ${colors.shade1}

;format-suffix = %{Fcolors.shade7}|%{F-}
;format-padding = 1


; Borders
label-fullscreen-overline = ${colors.background}
label-floating-overline = ${colors.background}
label-pseudotiled-overline = ${colors.background}
label-locked-overline = ${colors.background}
label-sticky-overline = ${colors.background}
label-private-overline = ${colors.background}
label-marked-overline = ${colors.background}

label-fullscreen-underline = ${colors.background}
label-floating-underline = ${colors.background}
label-pseudotiled-underline = ${colors.background}
label-locked-underline = ${colors.background}
label-sticky-underline = ${colors.background}
label-private-underline = ${colors.background}
label-marked-underline = ${colors.background}


; Mode Icons
label-fullscreen = 
label-fullscreen-padding-left = 1

label-floating = 
label-floating-padding-left = 1

label-pseudotiled = 
label-pseudotiled-padding-left = 1

label-locked = 
label-locked-padding-left = 1

label-sticky = 
label-sticky-padding-left = 1

label-private = 
label-private-padding-left = 1

label-marked = 
label-marked-padding-left = 1


;==========================================================
; LAUNCHER
;==========================================================

[module/launcher]

type = custom/text

format-background = ${colors.background}
format-foreground = ${colors.shade4}
format-padding = 1

click-left = "rofi -show drun"

format = ""


;==========================================================
; WINDOW TITLE
;==========================================================

[module/xwindow]

type = internal/xwindow

label = %title%
label-maxlen = 40
label-empty = Desktop

format = <label>

format-prefix = ""
format-prefix-foreground = ${colors.shade14}
format-foreground = ${colors.shade14}

;format-background = ${colors.shade16}

format-overline = ${colors.background}
format-underline = ${colors.background}


;==========================================================
; BLUETOOTH
;==========================================================

[module/bluetooth]

type = custom/text

format = ""
;format-padding = 1

click-left = blueman-manager





;==========================================================
; DUNST
;==========================================================

[module/dunst]

type = custom/ipc

initial = 1

format-foreground = ${colors.shade5}
format-background = ${colors.background}
format-padding = 1

hook-0 = echo "%{A1:notify-send "dunstctl set-paused toggle" && polybar-msg hook dunst 2:}  %{A}" &
hook-1 = echo "%{A1:notify-send "dunstctl set-paused toggle" && polybar-msg hook dunst 1:}  %{A}" &

click-middle = rofi_notif_center.sh &


;==========================================================
; PULSEAUDIO
;==========================================================

[module/pulseaudio]

type = internal/pulseaudio


; Volume
format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.shade16}

label-volume = %percentage%%
label-volume-foreground = ${colors.shade6}
label-volume-background = ${colors.shade16}
label-volume-minlen = 4
label-volume-alignment = center


; Muted
format-muted = <label-muted>
format-muted-background = ${colors.shade16}

label-muted =  Muted
label-muted-background = ${colors.shade16}
label-muted-foreground = ${colors.shade6}
label-muted-minlen = 4
label-muted-alignment = center


; Borders
format-volume-overline = ${colors.background}
format-muted-overline = ${colors.background}

format-volume-underline = ${colors.background}
format-muted-underline = ${colors.background}

label-volume-overline = ${colors.background}
label-muted-overline = ${colors.background}

label-volume-underline = ${colors.background}
label-muted-underline = ${colors.background}


; Mouse
click-right = pavucontrol


; Volume Bar
bar-volume-format = %{T8}%fill%%indicator%%empty%%{T-}
bar-volume-width = 2

bar-volume-gradient = false

bar-volume-foreground-0 = ${colors.shade6}
bar-volume-empty-foreground = ${colors.shade8}
bar-volume-indicator-foreground = ${colors.shade6}

bar-volume-fill = 
bar-volume-empty = 
bar-volume-indicator = 雷

bar-volume-fill-background = ${colors.shade16}
bar-volume-indicator-background = ${colors.shade16}
bar-volume-empty-background = ${colors.shade16}


; Volume Icon
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-foreground = ${colors.shade6}
ramp-volume-background = ${colors.shade16}
ramp-volume-padding-right = 1


;==========================================================
; BATTERY
;==========================================================

[module/battery]

type = internal/battery


; Battery / Adapter
full-at = 99

battery = BAT0
adapter = AC

poll-interval = 5


; Charging
format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.shade3}
format-charging-background = ${colors.shade16}
format-charging-padding-right = 5
format-charging-overline = ${colors.background}
format-charging-underline = ${colors.background}


; Full
format-full = <ramp-capacity> <label-full>
format-full-foreground = ${colors.shade3}
format-full-background = ${colors.shade16}
format-full-overline = ${colors.background}
format-full-underline = ${colors.background}


; Discharging
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.shade3}
format-discharging-background = ${colors.shade16}
format-discharging-padding-right = 5
format-discharging-overline = ${colors.background}
format-discharging-underline = ${colors.background}


; Labels
label-charging =  %percentage%% 
label-discharging = %percentage%% 
label-full = %percentage%%


; Capacity Icons
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 


; Capacity Bar
bar-capacity-width = 10


; Charging Animation
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 

animation-charging-framerate = 750


; Discharging Animation
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 

animation-discharging-framerate = 500


;==========================================================
; BACKLIGHT
;==========================================================

[module/backlight]

type = internal/backlight

card = intel_backlight

enable-scroll = true


; Format
format = <ramp><label>


; Label
label-background = ${colors.shade16}
label-foreground = ${colors.shade3}
label-overline = ${colors.background}
label-underline = ${colors.background}


; Brightness Icon
ramp-0 = 
ramp-foreground = ${colors.shade3}
ramp-background = ${colors.shade16}
ramp-overline = ${colors.background}
ramp-underline = ${colors.background}

ramp-padding-right = 1
ramp-padding-left = 1


; Brightness Bar
bar-width = 10

bar-indicator = 雷
bar-fill = 
bar-empty = 

bar-foreground-0 = ${colors.shade3}
bar-empty-foreground = ${colors.shade8}
bar-indicator-foreground = ${colors.shade3}

bar-fill-background = ${colors.shade16}
bar-indicator-background = ${colors.shade16}
bar-empty-background = ${colors.shade16}

bar-fill-overline = ${colors.background}
bar-fill-underline = ${colors.background}

bar-indicator-overline = ${colors.background}
bar-indicator-underline = ${colors.background}

bar-empty-overline = ${colors.background}
bar-empty-underline = ${colors.background}


;==========================================================
; ETHERNET
;==========================================================

[module/eth]

type = internal/network

interface-type = wired
interface = eth0
interval = 3.0


; Connected
format-connected-underline = ${xrdb:color2}
;format-connected-underline = ${colors.background}
format-connected-overline = ${colors.background}

format-connected-prefix = " "
format-connected-background = ${colors.shade16}
format-connected-padding = 1
format-connected-prefix-foreground = ${colors.shade5}

label-connected = %{A1:setsid -f connman-gtk:}ETH%{A}

label-connected-overline = ${colors.background}
label-connected-underline = ${colors.background}

label-disconnected-underline = ${colors.background}
label-disconnected-overline = ${colors.background}


; Disconnected
format-disconnected-overline = ${colors.background}
format-disconnected-underline = ${colors.background}

format-disconnected = 󰈂
format-disconnected-background = ${colors.shade16}
format-disconnected-foreground = ${colors.shade3}
format-disconnected-padding = 0


;==========================================================
; WLAN
;==========================================================

[module/wlan]

type = custom/script

exec = ~/.config/polybar/scripts/wifi.sh
interval = 3

label-maxlen = 10

click-left = ~/.config/polybar/scripts/wifi.sh --menu


format = <label>
format-background = ${colors.shade16}
format-foreground = ${colors.shade5}

label = %output%
label-padding = 1

format-overline = ${colors.background}
format-underline = ${colors.background}


;==========================================================
; DATE
;==========================================================

[module/date]

type = internal/date

interval = 5

date = %a, %b %d

format = <label>

;format-padding = 1

format-prefix = ""
format-prefix-foreground = ${colors.shade18}

format-foreground = ${colors.shade18}
format-background = ${colors.shade16}

format-overline = ${colors.background}
format-underline = ${colors.background}

;label = %date%
label = %{A1:~/.config/polybar/scripts/cal-popup.sh --popup &:}%date%%{A}


;==========================================================
; TIME
;==========================================================

[module/time]

type = internal/date

interval = 5

time = "%I:%M %p"
;time-alt = "%A, %B %d %Y"

format = <label>

format-background = ${colors.shade16}

format-prefix-foreground = ${colors.shade2}
format-foreground = ${colors.shade2}
format-prefix = " "

;format-padding = 1

format-overline = ${colors.background}
format-underline = ${colors.background}

;label = %{A1:notify-send -a Date -i /usr/share/icons/hicolor/64x64/apps/office-calendar.svg -u normal -t 3000 "$(date "+%A, %B %d %Y")":}%time%%{A}

label = %{A1:~/.config/polybar/scripts/cal-popup.sh --popup &:}%time%%{A}

click-left = "~/.config/polybar/scripts/cal-popup.sh --popup &"


;==========================================================
; POWER MENU
;==========================================================

[module/powermenu]

type = custom/text

format-background = ${colors.background}
format-foreground = ${colors.shade4}
format-padding = 1

click-left = "$HOME/.config/polybar/scripts/powermenu.sh"

format = "⏻"
